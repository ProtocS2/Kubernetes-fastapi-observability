apiVersion: v1
kind: Pod
metadata:
  name: memory-stress-test
  namespace: default
  labels:
    app: memory-stress-test
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress-ng:latest
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      command: ["/usr/bin/stress-ng"]
      args:
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "450M"
        - "--vm-hang"
        - "60"
        - "--timeout"
        - "300s"
        - "--metrics-brief"
