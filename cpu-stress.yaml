apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress-test
  namespace: default
  labels:
    app: cpu-stress-test
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress-ng:latest
      resources:
        requests:
          cpu: "500m"
          memory: "128Mi"
        limits:
          cpu: "2000m"
          memory: "256Mi"
      command: ["/usr/bin/stress-ng"]
      args:
        - "--cpu"
        - "2"
        - "--cpu-load"
        - "90"
        - "--timeout"
        - "300s"
        - "--metrics-brief"
